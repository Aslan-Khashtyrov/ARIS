name: ARIS safety checks

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install test dependencies
        run: python -m pip install --disable-pip-version-check websocket-client requests
      - name: Mirror Termux project path for tests
        run: |
          ln -s "$GITHUB_WORKSPACE" "$HOME/Arbitrage"
          mkdir -p "$HOME/Arbitrage/journal"
      - name: Compile Python sources
        run: python -m compileall -q .
      - name: Enforce worker import safety
        run: python -m unittest -q test_aris_worker_import_safety_v01.py
      - name: Enforce ping-only Termux bridge
        run: python -m unittest -q test_termux_control_policy_v01.py
      - name: Enforce read-only Codex review bridge
        run: python -m unittest -q test_codex_review_worker_v01.py
      - name: Enforce retired remote agents and PID safety
        run: python -m unittest -q test_remote_safety_policy_v01.py
      - name: Validate bridge activation shell
        run: bash -n aris_restart_bridges_safe.sh
      - name: Validate finite paper state
        run: python -m unittest -q test_main_paper_state_validation_v01.py
      - name: Run full tracked unit-test suite
        run: python -m unittest discover -q -p 'test_*.py'
      - name: Reject obvious committed secrets
        if: always()
        shell: bash
        run: |
          pattern='(sk-[A-Za-z0-9_-]{20,}|github_pat_[A-Za-z0-9_]{20,}|gh[pousr]_[A-Za-z0-9]{20,}|OPENAI_API_KEY[[:space:]]*=[[:space:]]*[^$[:space:]]+|TELEGRAM(_BOT)?_TOKEN[[:space:]]*=[[:space:]]*[^$[:space:]]+|BOT_TOKEN[[:space:]]*=[[:space:]]*[^$[:space:]]+|BYBIT_(API_)?(KEY|SECRET)[[:space:]]*=[[:space:]]*[^$[:space:]]+|BINANCE_(API_)?(KEY|SECRET)[[:space:]]*=[[:space:]]*[^$[:space:]]+|OKX_(API_)?(KEY|SECRET|PASSPHRASE)[[:space:]]*=[[:space:]]*[^$[:space:]]+)'
          if grep -RInE --include='*.py' --include='*.json' --include='*.yml' --include='*.yaml' --include='*.sh' --exclude='test_*.py' "$pattern" . --exclude-dir=.git; then
            echo 'Possible secret detected in tracked source.'
            exit 1
          fi
          echo 'No obvious committed secrets detected.'
